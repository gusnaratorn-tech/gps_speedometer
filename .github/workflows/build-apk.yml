name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --split-per-abi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Rename & Stage Artifacts
        run: |
          mkdir -p output_apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apks/gps_speedometer-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apks/gps_speedometer-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk output_apks/gps_speedometer-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk output_apks/gps_speedometer-universal.apk

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gps-speedometer-apks
          path: output_apks/*.apk

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
